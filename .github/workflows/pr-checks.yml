name: PR Checks

# PR ごとの追加チェック。型チェック・lint・ビルド・npm audit・CodeQL は ci-cd.yml が PR でも実行するので、
# ここには ci-cd.yml に無いものだけを置く。
# （actions/dependency-review-action はリポジトリの Dependency graph が無効なため使えない。
#   有効化したら追加できる: Settings → Security analysis → Dependency graph）
on:
  pull_request:
    branches: [ master ]

env:
  NODE_VERSION: '22'

# GITHUB_TOKEN は既定で読み取りのみ。追加の権限が必要なジョブだけ個別に広げる。
permissions:
  contents: read

jobs:
  rules-tests:
    name: Security Rules Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # firestore.rules / storage.rules をエミュレータで検証する。デプロイには関与しない。
    # テスト用ツールは package.json / package-lock.json に含めず、リポジトリ外に
    # --no-save で入れてから node_modules をシンボリックリンクで参照させる。
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup Java 21 (emulators)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache emulator binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-emulators-${{ runner.os }}-v15

    - name: Install test tools (outside the repo, --no-save)
      run: |
        mkdir -p "$RUNNER_TEMP/rules-tools"
        cd "$RUNNER_TEMP/rules-tools"
        npm init -y > /dev/null
        npm i --no-save --no-audit --no-fund \
          firebase-tools@15 @firebase/rules-unit-testing@5 firebase@12
        ln -s "$RUNNER_TEMP/rules-tools/node_modules" "$GITHUB_WORKSPACE/node_modules"

    - name: Run Firestore / Storage rules tests
      run: |
        "$RUNNER_TEMP/rules-tools/node_modules/.bin/firebase" emulators:exec \
          --only firestore,storage --project demo-kakeibo \
          "node test/firestore.rules.test.mjs && node test/storage.rules.test.mjs"

    # 保険: 上ではテスト用ツールを $RUNNER_TEMP に入れるので通常は常に成功する。
    # 将来リポジトリ内で npm i --no-save に変えた場合に、マニフェストの変更を検出するために残す。
    - name: Ensure package manifests are untouched (safety net)
      run: git diff --exit-code -- package.json package-lock.json
