name: Deploy to Production

# master への push では ci-cd.yml（Improved CI/CD Pipeline）がデプロイを担当する。
# 両方が push で動くと Functions を二重にデプロイするため、こちらは手動実行のみにする。
on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    # npm workspaces のためルートで一括インストールする。
    # サブディレクトリの npm ci では依存が解決できず tsc が落ちる。
    - name: Install dependencies
      run: npm ci

    - name: Lint Bot
      run: |
        cd bot
        npm run build
        
    - name: Lint Web
      run: |
        cd web
        npm run lint
        npm run build
        
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    # npm workspaces のためルートで一括インストールする。
    - name: Install dependencies
      run: npm ci

    - name: Build Bot
      run: |
        cd bot
        npm run build
        
    - name: Build Web
      run: |
        cd web
        npm run build
        
    # 認証は ci-cd.yml と同じサービスアカウント方式に揃える。
    # 旧構成の FIREBASE_TOKEN（firebase login:ci）は非推奨で、
    # 手動フォールバックとして使えない状態だった。
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Deploy Firebase Functions (Production)
      run: |
        npm install -g firebase-tools@15
        firebase deploy --only functions --project "$FIREBASE_PROJECT_ID"
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'line-kakeibo-0410' }}


    - name: Deploy to Vercel (Production)
      uses: amondnet/vercel-action@v25
      id: vercel-deploy
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./web
        scope: ${{ secrets.VERCEL_ORG_ID }}
        
    - name: Output Deployment URL
      run: |
        echo "🚀 Production deployed to: ${{ steps.vercel-deploy.outputs.preview-url }}"
        echo "DEPLOYMENT_URL=${{ steps.vercel-deploy.outputs.preview-url }}" >> $GITHUB_ENV
        
    - name: Notify Slack on Success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🚀 Production deployment successful!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        
    - name: Notify Slack on Failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ Production deployment failed!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}