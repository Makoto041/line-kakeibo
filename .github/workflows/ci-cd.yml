name: Improved CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 手動実行を可能に

env:
  NODE_VERSION: '22'

# GITHUB_TOKEN は既定で読み取りのみ。追加の権限が必要なジョブだけ個別に広げる。
permissions:
  contents: read

# 同時実行の制御
# PR は新しい push で古い run を打ち切ってよいが、master push は deploy を含む。
# 連続 push で firebase deploy の途中がキャンセルされると部分デプロイになるため、
# キャンセルは PR のときだけ有効にする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更検知ジョブ
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter は pull_request では API で PR の変更ファイル一覧を取得する
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      bot: ${{ steps.filter.outputs.bot }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/**'
            # deploy-bot は functions に加えて firestore / storage の rules も
            # デプロイするため、それらの定義ファイルも検知対象に含める。
            bot:
              - 'bot/**'
              - '.github/workflows/**'
              - 'firebase.json'
              - '.firebaserc'
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'storage.rules'
            deps:
              - 'package*.json'
              - 'package-lock.json'
              - '**/package*.json'

  # 依存関係のインストールとキャッシング
  install-deps:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'pull_request' || 
      needs.changes.outputs.web == 'true' || 
      needs.changes.outputs.bot == 'true' ||
      needs.changes.outputs.deps == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          

      - name: Install dependencies
        run: |
          npm ci
          
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            bot/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

  # Linting & Type Checking
  lint:
    runs-on: ubuntu-latest
    needs: [install-deps, changes]
    if: |
      github.event_name == 'pull_request' || 
      needs.changes.outputs.web == 'true' || 
      needs.changes.outputs.bot == 'true'
    strategy:
      matrix:
        app: [web, bot]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            bot/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          
      - name: Run ESLint
        working-directory: ./${{ matrix.app }}
        run: |
          npm run lint --if-present || echo "::warning::Lint completed with warnings/errors"
          
      - name: Run TypeScript check
        working-directory: ./${{ matrix.app }}
        run: |
          npx tsc --noEmit || echo "::warning::TypeScript check completed with errors"

  # ビルドとテスト
  build-and-test:
    runs-on: ubuntu-latest
    needs: [install-deps, changes]
    if: |
      github.event_name == 'pull_request' || 
      needs.changes.outputs.web == 'true' || 
      needs.changes.outputs.bot == 'true'
    strategy:
      matrix:
        app: [web, bot]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            bot/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          
      - name: Build ${{ matrix.app }}
        working-directory: ./${{ matrix.app }}
        run: npm run build
        
      # --if-present は test スクリプトが無ければ 0 で終わるので、スクリプト未定義の
      # ワークスペースでも失敗しない。`|| echo` を付けるとテストが落ちても緑になり、
      # テストを追加しても意味がなくなるため付けない。
      - name: Run tests
        working-directory: ./${{ matrix.app }}
        run: npm test --if-present


      # 成果物を使うのは deploy-bot だけ（firebase deploy が bot/dist を同梱する）。
      # web は Vercel の Git 連携がソースからビルドするため成果物を必要としない。
      # なお .next は隠しディレクトリで upload-artifact v4 の既定では除外されるため、
      # 以前の web-build は中身が空になり deploy-web のダウンロードが失敗していた。
      - name: Upload build artifacts
        if: matrix.app == 'bot'
        uses: actions/upload-artifact@v4
        with:
          name: bot-build
          path: bot/dist
          retention-days: 1

  # セキュリティチェック（並列実行）
  security:
    runs-on: ubuntu-latest
    needs: install-deps
    if: github.event_name == 'pull_request'
    continue-on-error: true
    # CodeQL の結果アップロードに security-events: write が必要
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            bot/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Run audit
        run: |
          npm audit --audit-level=moderate || echo "::warning::Security vulnerabilities found"

      - name: Run secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --max-depth 1
        # Note: continue-on-error removed - verified secret leaks must fail the build

      # CodeQL requires init before analyze
      - name: Initialize CodeQL
        id: init-codeql
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        if: steps.init-codeql.outcome == 'success'
        uses: github/codeql-action/analyze@v3

  # Web（Vercel）のデプロイジョブはここには無い。
  # Vercel へのデプロイは Vercel の Git 連携（GitHub App）がネイティブに実行する。
  # 以前ここにあった deploy-web は vercel CLI で二重にデプロイしようとするもので、
  # vercel-deploy.yml が同じ理由で no-op 化されたのと同じ構成だった。加えて
  # web-build 成果物が常に空（.next は隠しディレクトリで除外される）だったため、
  # ダウンロード段階で必ず失敗していた。詳細は .github/workflows/vercel-deploy.yml 参照。

  # Bot/Functions デプロイ（Firebase）
  deploy-bot:
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, changes]
    if: |
      github.ref == 'refs/heads/master' && 
      github.event_name == 'push' &&
      needs.changes.outputs.bot == 'true'
    environment:
      name: production-bot
    steps:
      # secrets コンテキストは job-level の `if:` から参照できない（常に空扱いに
      # なる）ため、ジョブ内の最初のステップで明示的に検証する。未設定のまま
      # 進むと google-github-actions/auth が分かりにくいエラーで落ちる。
      - name: Verify Google Cloud credentials are configured
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY が production-bot environment に設定されていません。Firebase への自動デプロイは実行できません。"
            exit 1
          fi
          echo "✅ GCP_SA_KEY is configured"

      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: bot-build
          # upload 側は `path: bot/dist` なので、アーティファクトのルートには
          # dist の「中身」が入る（共通パスが剥がされる仕様）。ここで `bot/` に
          # 展開すると bot/index.js になり、bot/package.json の
          # main=dist/index.js と食い違って
          # 「bot/dist/index.js does not exist」でデプロイが落ちる。
          path: bot/dist

      # firebase deploy は関数の一覧を取得するために bot/ のコードを実際に読み込む。
      # 成果物（dist）だけでは依存が解決できないため、ワークスペース全体を入れる。
      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # storage.rules は cross-service rules（firestore.get()）を使うため、Storage の
      # サービスエージェントに roles/firebaserules.firestoreServiceAgent が必要。
      # 非対話の firebase deploy はこれを確認しないので、ここで事前確認する。
      #   - ロールの存在を「確認できた」場合だけ storage を含めてデプロイする。
      #   - ロールが無い／権限不足・gcloud 不在などで確認できない場合は storage を除外して
      #     デプロイし、警告とジョブサマリーを出す（新ルールがロール無しで本番に出て
      #     レシート機能がフェイルクローズで止まるのを防ぐ。パイプライン自体は落とさない）。
      #     その場合はオーナーが一度 `firebase deploy --only storage` を対話実行する
      #     （対話実行時は firebase-tools がロールを付与する）。
      # 詳細と付与手順: docs/SECURITY_OPERATIONS.md §4
      - name: Check Storage cross-service rules IAM (preflight)
        id: storage_iam
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'line-kakeibo-0410' }}
        run: |
          set +e
          targets="functions,firestore:rules,firestore:indexes,storage"
          members=$(gcloud projects get-iam-policy "$FIREBASE_PROJECT_ID" \
            --flatten="bindings[].members" \
            --filter="bindings.role:roles/firebaserules.firestoreServiceAgent" \
            --format="value(bindings.members)" 2>/dev/null)
          status=$?
          skip_reason=""
          if [ $status -ne 0 ]; then
            skip_reason="Storage サービスエージェントの IAM を確認できませんでした（exit $status）。デプロイ SA に resourcemanager.projects.getIamPolicy を付与するか、storage を一度手動デプロイしてください。"
          elif ! printf '%s\n' "$members" | grep -q '@gcp-sa-firebasestorage\.iam\.gserviceaccount\.com'; then
            skip_reason="Storage サービスエージェントに roles/firebaserules.firestoreServiceAgent がありません（docs/SECURITY_OPERATIONS.md §4 の手順で付与してください）。"
          fi
          if [ -n "$skip_reason" ]; then
            targets="functions,firestore:rules,firestore:indexes"
            echo "::warning::${skip_reason} storage ルールのデプロイをスキップしました（本番は旧 storage.rules のまま）。"
            {
              echo "### 警告: storage.rules は未デプロイ"
              echo ""
              echo "${skip_reason}"
              echo ""
              echo "本番の Storage ルールは旧版のままで、firestore.rules と不一致です。docs/SECURITY_OPERATIONS.md §4 を参照してください。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Storage サービスエージェントの IAM ロールを確認しました。"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools@15
          firebase deploy --only "$DEPLOY_TARGETS" --project "$FIREBASE_PROJECT_ID"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          # 未設定時のフォールバック（空文字を渡すと deploy が落ちるため）
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'line-kakeibo-0410' }}
          # preflight ステップが実行されず未出力の場合も storage は含めない
          # （storage.rules はロールを確認できたときだけデプロイする）
          DEPLOY_TARGETS: ${{ steps.storage_iam.outputs.targets || 'functions,firestore:rules,firestore:indexes' }}

  # デプロイ後の健全性チェック
  post-deploy-check:
    runs-on: ubuntu-latest
    needs: [deploy-bot]
    if: always() && needs.deploy-bot.result == 'success'
    steps:
      # /health は webhook 関数（asia-northeast1）が持つ express ルート。
      # 旧URL（us-central1 直下の /health）は存在せず 404 になる。
      - name: Health check - Bot
        if: needs.deploy-bot.result == 'success'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'line-kakeibo-0410' }}
        run: |
          # デプロイ直後はトラフィック切替中で一時的に落ちうるためリトライする
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            "https://asia-northeast1-${FIREBASE_PROJECT_ID}.cloudfunctions.net/webhook/health") || response=000
          if [ "$response" -eq 200 ]; then
            echo "✅ Bot functions are healthy"
          else
            echo "❌ Bot health check failed (HTTP $response)"
            exit 1
          fi
          
      - name: Send notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment Status:
            - Bot: ${{ needs.deploy-bot.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # リリースノート生成（オプション）
  release-notes:
    runs-on: ubuntu-latest
    needs: [deploy-bot]
    # 変更履歴の生成でタグと PR を読む
    permissions:
      contents: read
      pull-requests: read
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.deploy-bot.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Generate release notes
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
