# Dependabot 設定
#
# npm workspaces（web / bot）はルートの package-lock.json を共有するため、npm はルート（"/"）の
# 1 エントリだけで管理する。"/web" や "/bot" を別エントリにすると package.json だけが更新され、
# ロックファイルと食い違って CI の npm ci が失敗する。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # ESLint のメジャー更新は eslint-config-next の対応を待って手動で上げる
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci):"
    labels:
      - "ci/cd"
      - "dependencies"
